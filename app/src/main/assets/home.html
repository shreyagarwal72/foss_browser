<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petal Browser</title>
    <style>
        :root {
            --bg-color: #121318;
            --surface-color: #1E1F25;
            --primary: #A8C7FA;
            --on-surface: #E3E2E6;
            --on-surface-variant: #C4C6D0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Logo */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #A8C7FA, #7CACF8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(168, 199, 250, 0.25);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #062E6F;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF, #A8C7FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Offline Search Form */
        .search-box {
            width: 100%;
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 36px;
            transition: border-color 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
        }

        .search-box svg {
            width: 22px;
            height: 22px;
            fill: var(--on-surface-variant);
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            height: 48px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--on-surface);
            font-size: 1rem;
            font-weight: 400;
        }

        .search-input::placeholder {
            color: var(--on-surface-variant);
        }

        /* Speed Dial Shortcuts Grid */
        .section-title {
            width: 100%;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--on-surface-variant);
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .grid-speeddial {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--on-surface);
            gap: 8px;
        }

        .shortcut-icon {
            width: 56px;
            height: 56px;
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease;
        }

        .shortcut-item:active .shortcut-icon {
            transform: scale(0.92);
        }

        .shortcut-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--on-surface-variant);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 64px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-box">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            </div>
            <h1 class="brand-title">Petal</h1>
        </div>

        <!-- Search Bar -->
        <form class="search-box" action="https://duckduckgo.com/" method="get">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" name="q" placeholder="Search web or enter URL..." autocomplete="off">
        </form>

        <!-- Speed Dial -->
        <div class="section-title">Speed Dial</div>
        <div class="grid-speeddial">
            <a href="https://www.google.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #4285F4;">G</div>
                <span class="shortcut-label">Google</span>
            </a>
            <a href="https://duckduckgo.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #DE5833;">DDG</div>
                <span class="shortcut-label">DuckDuckGo</span>
            </a>
            <a href="https://wikipedia.org" class="shortcut-item">
                <div class="shortcut-icon" style="color: #E3E2E6;">W</div>
                <span class="shortcut-label">Wikipedia</span>
            </a>
            <a href="https://youtube.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #FF0000;">YT</div>
                <span class="shortcut-label">YouTube</span>
            </a>
            <a href="https://github.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #FFFFFF;">GH</div>
                <span class="shortcut-label">GitHub</span>
            </a>
            <a href="https://reddit.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #FF4500;">R</div>
                <span class="shortcut-label">Reddit</span>
            </a>
            <a href="https://amazon.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #FF9900;">A</div>
                <span class="shortcut-label">Amazon</span>
            </a>
            <a href="https://twitter.com" class="shortcut-item">
                <div class="shortcut-icon" style="color: #1DA1F2;">X</div>
                <span class="shortcut-label">X/Twitter</span>
            </a>
        </div>
    </div>

</body>
</html>
